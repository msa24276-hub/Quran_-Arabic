<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QURAN.ARABIC ACADEMY — سجل الحصص</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--nv:#124e46;--nv2:#0d3a34;--gd:#fadc82;--bg:#fff;--cd:#fff;--tx:#16302c;--mu:#5f7a74;--ln:#1a24400f;--ln2:#1a244024;--gr:#16a34a;--rd:#dc2626;--sf:#f4f6fa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b2420;--cd:#12332d;--tx:#eef6f3;--mu:#9db8b0;--ln:#ffffff14;--ln2:#ffffff26;--sf:#0f2a25}}
:root[data-theme=dark]{--bg:#0b2420;--cd:#12332d;--tx:#eef6f3;--mu:#9db8b0;--ln:#ffffff14;--ln2:#ffffff26;--sf:#0f2a25}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:600 14px/1.6 Cairo,system-ui,sans-serif}
button,select,input{font:inherit;color:inherit}
.hd{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--cd);border-bottom:1px solid var(--ln2);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
.lg{width:42px;height:42px;border-radius:14px;background:var(--nv);display:grid;place-items:center;font-size:20px;flex:none}
.tt{font-weight:800;font-size:18px;line-height:1.2}.tg{font-size:10px;background:var(--sf);border:1px solid var(--ln2);border-radius:8px;padding:0 6px;margin-inline-start:6px;font-weight:600}
.sm{font-size:12px;color:var(--mu)}.ct{flex:1;text-align:center;color:var(--mu);font-size:12px}
.ch{border:1px solid var(--ln2);background:var(--sf);border-radius:12px;padding:5px 12px;font-size:12px;font-weight:800;cursor:pointer;min-height:38px}
.ch.g{color:var(--gr);background:#16a34a14;border-color:#16a34a40}.ch.r{color:var(--rd);background:#dc262612;border-color:#dc262640}
.dot{display:inline-block;width:8px;height:8px;border-radius:9px;background:var(--gr);margin-inline-end:5px}
.wrap{display:flex;min-height:calc(100vh - 66px)}
aside{width:250px;flex:none;padding:16px 12px;border-inline-start:1px solid var(--ln2);background:var(--cd);display:flex;flex-direction:column;gap:4px}
aside button{display:flex;gap:10px;align-items:center;border:0;background:none;border-radius:14px;padding:12px 14px;font-weight:800;color:var(--mu);cursor:pointer;text-align:start;min-height:46px}
aside button.on{background:var(--nv);color:#fff}
.ft{margin-top:auto;font-size:11px;color:var(--mu);padding:10px}
main{flex:1;min-width:0;padding:22px;max-width:1000px;margin:0 auto;width:100%}
h1{font-size:22px;font-weight:800;margin:0 0 4px}h2{font-size:17px;font-weight:800;margin:0 0 8px}
.cd{background:var(--cd);border:1px solid var(--ln2);border-radius:20px;padding:16px;margin-bottom:14px}
.hero{background:var(--nv);color:#fff;border-radius:24px;padding:22px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hero small{color:var(--gd)}.hero h1{font-size:26px;margin:2px 0}.hero p{margin:0;color:#ffffffb8;font-size:13px}
.bt{border:0;border-radius:14px;min-height:46px;padding:0 18px;font-weight:800;cursor:pointer;background:var(--nv);color:#fff}
.bt.gd{background:var(--gd);color:var(--nv)}.bt.gh{background:#ffffff1a;color:#fff}.bt.sf{background:var(--sf);color:var(--tx);border:1px solid var(--ln2)}.bt.rd{background:var(--rd)}.bt.sm2{min-height:38px;padding:0 12px}
.gr4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.st{background:var(--cd);border:1px solid var(--ln2);border-radius:20px;padding:16px}.st.nv{background:var(--nv);color:#fff;border:0}
.st b{display:block;font-size:30px;font-weight:800;line-height:1.3}.st span{font-size:13px;color:var(--mu)}.st.nv span{color:#ffffffb3}
.lk{color:var(--nv);font-size:12px;font-weight:800;border:0;background:none;padding:0;cursor:pointer}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 4px;border-top:1px solid var(--ln)}
.row:first-of-type{border-top:0}
.sc{overflow-x:auto;border:1px solid var(--ln2);border-radius:16px}
table{width:100%;border-collapse:collapse;font-size:13px}th{background:var(--sf);text-align:start;color:var(--mu);font-size:12px}
th,td{padding:12px 10px;border-top:1px solid var(--ln);white-space:nowrap}th{border-top:0}
.pl{border-radius:99px;padding:2px 10px;font-size:12px;font-weight:800}.pl.p{background:#16a34a1f;color:var(--gr)}.pl.a{background:#dc26261f;color:var(--rd)}
.fl{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fl label,.fm label{display:block;font-size:12px;color:var(--mu)}
input,select{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--ln2);background:var(--sf);padding:6px 12px;margin-top:3px}
.tb{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tb .bt{flex:none}
.wn{background:#f59e0b1a;border:1px solid #f59e0b55;color:#b45309;border-radius:14px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.ok{background:#16a34a1f;color:var(--gr);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-weight:800}
.er{background:#dc26261f;color:var(--rd);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-weight:800}
.ov{position:fixed;inset:0;background:#0009;z-index:30;display:grid;place-items:end center}
.md{background:var(--cd);width:100%;max-width:440px;border-radius:24px 24px 0 0;padding:18px;max-height:90vh;overflow:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.ov{place-items:center}.md{border-radius:24px}}
.fm{display:grid;gap:10px;margin:10px 0}
.bn{display:none}
.lgn{min-height:100vh;display:grid;place-items:center;background:var(--nv);padding:16px}.lgn .cd{max-width:380px;width:100%;margin:0}
.ban{background:var(--gd);color:var(--nv);text-align:center;font-size:12px;font-weight:800;padding:3px}
@media(max-width:820px){aside{display:none}main{padding:14px 12px 90px}.gr4{grid-template-columns:1fr 1fr}.fl{grid-template-columns:1fr 1fr}.ct{display:none}
.bn{display:flex;position:fixed;inset-inline:0;bottom:0;background:var(--cd);border-top:1px solid var(--ln2);z-index:6;padding-bottom:env(safe-area-inset-bottom,0px)}
.bn button{flex:1;border:0;background:none;font-size:11px;font-weight:800;color:var(--mu);padding:8px 2px;min-height:58px;cursor:pointer}.bn button.on{color:var(--nv)}
:root[data-theme=dark] .bn button.on{color:var(--gd)}.hero h1{font-size:20px}}
:root[data-theme=dark] .lk{color:var(--gd)}@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .lk{color:var(--gd)}}img.lg{object-fit:cover}.er[hidden]{display:none}</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="supabaseClient.js"></script>
<script>
const LOGO="logo.png";
const $=h=>document.getElementById("app").innerHTML=h,f2=(n,d=2)=>Number(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const DUR=[[15,"ربع ساعة"],[20,"ثلث ساعة"],[30,"نصف ساعة"],[40,"ثلثا ساعة"],[45,"45 دقيقة"],[60,"ساعة"],[75,"ساعة وربع"],[90,"ساعة ونصف"],[105,"ساعتان إلا ربع"],[120,"ساعتان"],[135,"ساعتان وربع"],[150,"ساعتان ونصف"],[165,"ثلاث ساعات إلا ربع"],[180,"ثلاث ساعات"],[195,"ثلاث ساعات وربع"],[210,"ثلاث ساعات ونصف"],[225,"ثلاث ساعات وثلاثة أرباع"],[240,"أربع ساعات"]];
const dl=m=>(DUR.find(d=>d[0]==m)||[0,m+" د"])[1]+" ("+m+" دقيقة)";
const day=d=>new Date(d+"T12:00:00").toLocaleDateString("ar-EG",{weekday:"long"});
let TS=[],FM=[],ST=[],L=[],AD=[],CUR=0,T={name:"—",rate:0,un:""},ME=null;
const tn=id=>TS.find(x=>x.id==id)||{name:"—",rate:0,un:"",id};
let S={u:null,lk:"admin",p:"",dk:0,tab:"act",q:"",fs:"",fst:"",ex:{},fx:52.65,md:null,msg:"",err:"",f:{s:"",d:"2026-10-14",m:60,st:"p"},more:0};
const fnm=f=>f?(FM.find(x=>x.id==f)||{n:"—"}).n:"بدون أسرة",tOf=sid=>(ST.find(s=>s.id==sid)||{t:0}).t,mineL=()=>act().filter(l=>tOf(l.s)==CUR),stl=()=>ST.filter(s=>s.active!==false&&(S.u=="admin"||s.t==CUR)),sn0=0,sn=id=>(ST.find(s=>s.id==id)||{n:"—"}).n,act=()=>L.filter(l=>!l.del),wage=l=>l.st=="p"?l.m/60*l.r:0,rev=l=>l.st=="p"?l.m/60*l.p:0;
const hrs=a=>a.filter(l=>l.st=="p").reduce((x,l)=>x+l.m,0)/60;
const NAV={admin:[["ov","نظرة عامة","▦"],["les","سجل الحصص","📖"],["fam","الأسر والطلاب","👥"],["tea","المعلمون والأجور","🎓"],["adm","المشرفون","🛡"],["stu","سجل الطلاب الشامل","🧑‍🎓"],["fin","الملخص المالي","$"]],teacher:[["add","+ حصة","＋"],["mine","حصصي","📖"],["stu2","طلابي","👥"]]};
function login(){$(`<div class="lgn"><div class="cd"><div style="text-align:center"><img class="lg" alt="" style="width:88px;height:88px;display:block;margin:0 auto 8px" src="${LOGO}"><h1>سجل الحصص</h1><div class="sm">QURAN.ARABIC ACADEMY</div></div>
<div class="tb" style="margin-top:14px"><button class="bt ${S.lk=="teacher"?"":"sf"}" style="flex:1" onclick="S.lk='teacher';S.err='';login()">دخول المعلم</button><button class="bt ${S.lk=="admin"?"":"sf"}" style="flex:1" onclick="S.lk='admin';S.err='';login()">دخول المشرف</button></div>
<div class="fm"><label>اسم المستخدم<input id="u" dir="ltr" value=""></label><label>كلمة المرور<input id="pw" dir="ltr" type="password"></label></div>
${S.err?`<div class="er">${S.err}</div>`:""}<button id="lgbtn" class="bt" style="width:100%" onclick="tryLogin()">دخول</button>
</div></div>`)}
function shell(b){const r=S.u,it=NAV[r],pr=r=="admin"?it.slice(0,4):it;
 return `<div class="hd"><img class="lg" alt="" src="${LOGO}"><div><div class="tt">سجل الحصص <span class="tg">QURAN.ARABIC ACADEMY</span></div><div class="sm">مسجّل كـ: ${ME.name} — ${r=="admin"?"مشرف":"معلم"}</div></div>
 <div class="ct">${new Date().toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div><span style="flex:1" class="ct"></span>
 <span class="ch g"><i class="dot"></i>سحابي مشترك</span><button class="ch" onclick="S.dk=!S.dk;document.documentElement.dataset.theme=S.dk?'dark':'light'">🌙</button><button class="ch r" onclick="out()">خروج ⎋</button></div>
 <div class="wrap"><aside>${it.map(n=>`<button class="${S.p==n[0]?"on":""}" onclick="nav('${n[0]}')"><span>${n[2]}</span>${n[1]}</button>`).join("")}<div class="ft"><b>QURAN.ARABIC ACADEMY</b><br>سجل الحصص والحسابات</div></aside><main>${b}</main></div>
 <div class="bn">${pr.map(n=>`<button class="${S.p==n[0]?"on":""}" onclick="nav('${n[0]}')">${n[2]}<br>${n[1].replace(" والأجور","").replace(" الشامل","").replace(" (الأجور)","")}</button>`).join("")}${r=="admin"?`<button onclick="S.more=1;R()">⋯<br>المزيد</button>`:""}</div>
 ${S.more?`<div class="ov" onclick="S.more=0;R()"><div class="md" onclick="event.stopPropagation()"><h2>المزيد</h2><div class="fm">${it.slice(4).map(n=>`<button class="bt sf" onclick="nav('${n[0]}')">${n[2]} ${n[1]}</button>`).join("")}</div></div></div>`:""}${S.md?mod():""}`}
function mod(){const m=S.md;let h="";
 if(m.t=="add")h=`<h2>${S.u=="admin"?"تسجيل حصة نيابةً عن معلم":"تسجيل حصة"}</h2>${form()}<button class="bt" style="width:100%" onclick="saveL()">حفظ الحصة</button>`;
 if(m.t=="rate")h=`<h2>تعديل أجر الساعة ($)</h2><div class="fm"><label>الأجر الجديد<input id="rt" dir="ltr" value="${T.rate}"></label><div class="sm">يسري على الحصص الجديدة فقط؛ الحصص السابقة تحتفظ بأجرها.</div></div><button class="bt" style="width:100%" onclick="T.rate=+document.getElementById('rt').value||T.rate;S.md=null;R()">حفظ</button>`;
 if(m.t=="fx")h=`<h2>تعديل سعر الصرف</h2><div class="fm"><label>1 دولار = ... جنيه<input id="fxv" dir="ltr" value="${S.fx}"></label></div><button class="bt" style="width:100%" onclick="saveFx()">حفظ</button>`;
 if(m.t=="adm")h=`<h2>إضافة مشرف جديد</h2><div class="fm"><label>الاسم<input id="an"></label><label>اسم المستخدم<input id="au" dir="ltr"></label><label>كلمة المرور<input id="ap" dir="ltr" type="password"></label></div><button class="bt" style="width:100%" onclick="addAd()">إضافة</button>`;
 h+=mod2(m);return `<div class="ov" onclick="S.md=null;R()"><div class="md" onclick="event.stopPropagation()"><div id="merr" class="er" ${S.err?"":"hidden"}>${S.err||""}</div>${h}<button class="bt sf" style="width:100%;margin-top:8px" onclick="S.md=null;S.err='';R()">إلغاء</button></div></div>`}
function form(){const f=S.f;return `<div class="fm"><label>الطالب<select onchange="S.f.s=this.value"><option value="">— اختر الطالب —</option>${stl().map(s=>`<option value="${s.id}" ${f.s==s.id?"selected":""}>${s.n}</option>`).join("")}</select></label>
<label>التاريخ<input type="date" value="${f.d}" onchange="S.f.d=this.value"></label><label>المدة<select onchange="S.f.m=+this.value">${DUR.map(d=>`<option value="${d[0]}" ${f.m==d[0]?"selected":""}>${d[1]}</option>`).join("")}</select></label>
<div class="tb"><button class="bt ${f.st=="p"?"":"sf"}" style="flex:1" onclick="S.f.st='p';R()">حضر</button><button class="bt ${f.st=="a"?"rd":"sf"}" style="flex:1" onclick="S.f.st='a';R()">غاب</button></div></div>`}
const fld=(id,l,v,x="")=>`<label>${l}<input id="${id}" ${x} value="${v??""}"></label>`,g=id=>document.getElementById(id).value.trim(),done=m=>{S.md=null;S.err="";S.msg=m;R()},bad=m=>{S.err=m;const e=document.getElementById("merr");if(e){e.textContent=m;e.hidden=false}else R()},
 sel=(id,l,o,v)=>`<label>${l}<select id="${id}">${o.map(x=>`<option value="${x[0]}" ${x[0]==v?"selected":""}>${x[1]}</option>`).join("")}</select></label>`,
 B=(c,f,t)=>`<button class="bt ${c}" style="width:100%;margin-top:6px" onclick="${f}">${t}</button>`;
function mod2(m){const t=m.t[0]=="t"||m.t=="pw"?(m.id?tn(m.id):null):null,st=m.t=="se"||m.t=="sd"?ST.find(z=>z.id==m.id):null,fa=m.t=="fe"||m.t=="fd"?FM.find(z=>z.id==m.id):null;
 if(m.t=="ld"){const l=L.find(x=>x.id==m.id);return `<h2>تأكيد حذف الحصة</h2><p>حذف حصة <b>${sn(l.s)}</b> بتاريخ ${l.d}؟ تنتقل إلى «المحذوفة» ويمكن استرجاعها.</p>${B("rd","delL("+l.id+")","تأكيد الحذف")}`}
 if(m.t=="te")return `<h2>${t?"تعديل المعلم":"إضافة معلم"}</h2><div class="fm">${fld("tn","الاسم",t?t.name:"")}${fld("tu","اسم المستخدم (إنجليزي صغير)",t?t.un:"",'dir="ltr" autocapitalize="none"')}${t?"":fld("tp","كلمة المرور (8 أحرف فأكثر)","",'dir="ltr" type="password"')}${fld("tr","أجر الساعة ($)",t?t.rate:3.25,'dir="ltr"')}<div class="sm">تغيير الأجر يسري على الحصص الجديدة فقط.</div></div>${B("","saveT("+(m.id||0)+")","حفظ")}`;
 if(m.t=="pw")return `<h2>إعادة تعيين كلمة مرور ${t.name}</h2><div class="fm">${fld("pp","كلمة المرور الجديدة","",'dir="ltr"')}</div>${B("","savePw("+t.id+")","حفظ")}`;
 if(m.t=="tsw")return `<h2>${t.active?"إيقاف":"تفعيل"} ${t.name}</h2><p>${t.active?"سيُمنع من الدخول فوراً وتبقى بياناته.":"سيتمكن من الدخول من جديد."}</p>${B("","swT("+t.id+")","تأكيد")}`;
 if(m.t=="tdel"){const has=ST.some(z=>z.t==t.id)||FM.some(z=>z.t==t.id)||L.some(l=>tOf(l.s)==t.id);return `<h2>حذف ${t.name}</h2>${has?`<p>لهذا المعلم طلاب أو أسر أو حصص، فالحذف النهائي غير متاح. الأرشفة تخفيه وتمنع دخوله وتُبقي كل حصصه وتقاريره.</p>${B("sf","delT("+t.id+",'stop')","تأكيد الإيقاف فقط")}${B("rd","delT("+t.id+",'arch')","تأكيد الأرشفة مع الاحتفاظ بالسجلات")}`:`<p>لا توجد بيانات مرتبطة. سيُحذف نهائياً.</p>${B("rd","delT("+t.id+",'del')","تأكيد الحذف النهائي")}`}`}
 const to=TS.filter(x=>!x.arch).map(x=>[x.id,x.name]);
 if(m.t=="fe")return `<h2>${fa?"تعديل الأسرة":"إضافة أسرة"}</h2><div class="fm">${fld("fn","اسم الأسرة",fa?fa.n:"")}${sel("ft","المعلم",to,fa?fa.t:to[0][0])}${fa?'<div class="sm">تغيير المعلم ينقل طلاب الأسرة معه، وتبقى حصصهم السابقة كما هي.</div>':""}</div>${B("","saveF("+(m.id||0)+")","حفظ")}`;
 if(m.t=="fd")return `<h2>حذف ${fa.n}</h2><p>في الأسرة ${ST.filter(z=>z.f==fa.id).length} طالب.</p>${B("sf","delF("+fa.id+",'only')","تأكيد حذف الأسرة فقط (يصير طلابها بدون أسرة)")}${B("rd","delF("+fa.id+",'all')","تأكيد حذف الأسرة وطلابها وحصصهم نهائياً")}`;
 if(m.t=="se")return `<h2>${st?"تعديل / نقل الطالب":"إضافة طالب"}</h2><div class="fm">${fld("sn","اسم الطالب",st?st.n:"")}${sel("st","المعلم",to,st?st.t:to[0][0])}${sel("sf","الأسرة",[[0,"بدون أسرة"]].concat(FM.map(x=>[x.id,x.n+" ("+tn(x.t).name+")"])),st?st.f:0)}${fld("sp","سعر ساعة الطالب ($) — للمشرف فقط",st?st.p:8,'dir="ltr"')}<div class="sm">تغيير السعر يسري على الحصص الجديدة فقط.</div></div>${B("","saveS("+(m.id||0)+")","حفظ")}`;
 if(m.t=="sd")return `<h2>حذف ${st.n}</h2><p>للطالب ${L.filter(l=>l.s==st.id).length} حصة في هذا الشهر (وقد توجد حصص في شهور أخرى).</p>${B("sf","delS("+st.id+",'stop')","تأكيد إيقاف الطالب (تبقى كل حصصه)")}${B("rd","delS("+st.id+",'all')","تأكيد حذف الطالب وكل حصصه نهائياً")}`;
 return ""}

  all(()=>sb.from("teachers").select("id,name,username,hourly_rate_usd,active,deleted_at").order("name").order("id")),
  all(()=>sb.from("families").select("id,name,teacher_id").order("name").order("id")),
  all(()=>sb.from("students").select(ad?"id,name,teacher_id,family_id,active,student_pricing(rate_usd)":"id,name,teacher_id,family_id,active").order("name").order("id")),
  all(()=>sb.from("lessons").select(ad?LC+",deleted_at,seen_by_admin_at,lesson_pricing(student_rate_usd)":LC).gte("lesson_date",S.month+"-01").lt("lesson_date",nextM(S.month)).order("lesson_date",{ascending:false}).order("created_at",{ascending:false}).order("id")),
  sb.rpc("get_exchange_rate")]);
 TS=te.map(t=>({id:iid(t.id),name:t.name,un:t.username,rate:+t.hourly_rate_usd,active:t.active,arch:t.deleted_at?1:0}));
 FM=fa.map(f=>({id:iid(f.id),n:f.name,t:iid(f.teacher_id)}));
 ST=st.map(s=>({id:iid(s.id),n:s.name,t:iid(s.teacher_id),f:s.family_id?iid(s.family_id):0,p:+((one(s.student_pricing)||{}).rate_usd||0),active:s.active}));
 L=le.map(l=>({id:iid(l.id),s:iid(l.student_id),m:l.duration_minutes,st:l.status=="present"?"p":"a",d:l.lesson_date,note:l.note||"",r:+l.teacher_rate_usd||0,p:+((one(l.lesson_pricing)||{}).student_rate_usd||0),del:l.deleted_at?1:0,nw:!l.seen_by_admin_at}));
 if(fx.data)S.fx=+fx.data;
 if(ad){const a=await sb.rpc("admin_list_admins");if(a.error)throw a.error;AD=(a.data||[]).map(x=>({id:iid(x.id),n:x.display_name||"مشرف",un:String(x.email).split("@")[0],me:x.id==ME.id,dt:(x.created_at||"").slice(0,10)}))}
 else{CUR=iid(ME.teacherId);T=tn(CUR)}}
async function tryLogin(){const u=document.getElementById("u").value.trim().toLowerCase(),p=document.getElementById("pw").value;
 if(!u||!p){S.err="اكتب اسم المستخدم وكلمة المرور";return login()}
 if(u.includes("@")){S.err="اكتب اسم المستخدم فقط بدون @";return login()}
 const b=document.getElementById("lgbtn");if(b){b.disabled=true;b.textContent="جارٍ الدخول..."}
 try{const r=await sb.auth.signInWithPassword({email:u+"@"+(S.lk=="admin"?"admin.":"")+"quran.arabic.academy",password:p});
  if(r.error){const m=(r.error.message||"").toLowerCase();S.err=m.includes("banned")?"هذا الحساب موقوف. تواصل مع الإدارة":m.includes("invalid")?"اسم المستخدم أو كلمة المرور غير صحيحة (وتأكد أنك اخترت «دخول المعلم» أو «دخول المشرف» الصحيح)":m.includes("fetch")||m.includes("network")?"لا يوجد اتصال بالخادم، أعد المحاولة":"تعذّر الدخول: "+r.error.message;return login()}
  const me=await loadMe(r.data.user);
  if(me.error){await sb.auth.signOut();S.err=me.error;return login()}
  if(me.role!=S.lk){await sb.auth.signOut();S.err=me.role=="admin"?"هذا حساب مشرف. اختر «دخول المشرف»":"هذا حساب معلم. اختر «دخول المعلم»";return login()}
  ME=me;await go(me.role)}catch(e){S.err=ea(e);login()}}
async function go(r){S.u=r;S.p=NAV[r][0][0];S.err="";S.msg="";S.more=0;S.md=null;$('<div class="lgn"><div class="cd" style="text-align:center">جارٍ التحميل...</div></div>');
 try{await loadAll()}catch(e){await sb.auth.signOut();S.u=null;S.err=ea(e);return login()}R()}
async function nav(p){S.p=p;S.more=0;S.msg="";S.err="";S.md=null;try{await loadAll()}catch(e){S.err=ea(e)}R();scrollTo(0,0);
 if(S.u=="admin"&&p=="les"){const ids=L.filter(l=>l.nw&&!l.del).map(l=>uid(l.id));if(ids.length)sb.rpc("admin_mark_lessons_seen",{p_ids:ids})}}
async function out(){try{await sb.auth.signOut()}catch(e){}ME=null;S.u=null;location.replace(location.pathname)}
async function setMonth(v){if(!v)return;S.month=v;try{await loadAll()}catch(e){S.err=ea(e)}R()}
async function run(fn,ok){try{const r=await fn();if(r&&r.error)throw r.error;await loadAll();done(ok)}catch(e){bad(ea(e))}}
async function saveL(){const f=S.f;S.err="";if(!f.s){S.err="اختر الطالب أولاً";return R()}
 const s=ST.find(z=>z.id==f.s),old=f.s;if(!f.d){S.err="اختر التاريخ";return R()}
 await run(()=>sb.from("lessons").insert({student_id:uid(f.s),teacher_id:uid(s.t),lesson_date:f.d,duration_minutes:f.m,status:f.st=="p"?"present":"absent"}),"تم حفظ الحصة ✓");
 if(S.err){S.f.s=old;R()}else{S.f.s="";if(S.u=="admin"){S.p="les";R()}}}
const delL=id=>run(()=>sb.from("lessons").update({deleted_at:new Date().toISOString()}).eq("id",uid(id)),"تم حذف الحصة ✓ — يمكن استرجاعها من تبويب المحذوفة");
const restL=id=>run(()=>sb.from("lessons").update({deleted_at:null}).eq("id",uid(id)),"تم استرجاع الحصة ✓");
function saveT(id){const n=g("tn"),u=g("tu").toLowerCase(),r=g("tr");S.err="";
 if(!n)return bad("اسم المعلم مطلوب");if(!/^[a-z0-9_-]{3,30}$/.test(u))return bad("اسم المستخدم 3-30 حرفاً: إنجليزي صغير وأرقام و _ و - فقط");
 if(r===""||!(+r>=0))return bad("الأجر يجب أن يكون رقماً صفراً أو أكثر");
 if(id)return run(()=>sb.rpc("admin_update_teacher",{p_id:uid(id),p_name:n,p_username:u,p_rate:+r}),"تم حفظ المعلم ✓ — اسم المستخدم الجديد يعمل فوراً");
 const p=document.getElementById("tp").value;if(p.length<8)return bad("كلمة المرور يجب ألا تقل عن 8 أحرف");
 return run(()=>sb.rpc("admin_create_teacher",{p_name:n,p_username:u,p_password:p,p_rate:+r}),"تمت إضافة المعلم ✓ — يمكنه الدخول الآن")}
function savePw(id){const p=document.getElementById("pp").value;if(p.length<8)return bad("كلمة المرور يجب ألا تقل عن 8 أحرف");
 return run(()=>sb.rpc("admin_set_teacher_password",{p_teacher:uid(id),p_password:p}),"تم تغيير كلمة المرور ✓ — القديمة لم تعد تعمل")}
function swT(id){const t=tn(id);return run(()=>sb.rpc("admin_set_teacher_active",{p_id:uid(id),p_active:!t.active}),t.active?"تم إيقاف المعلم ✓":"تم تفعيل المعلم ✓")}
function delT(id,m){return run(()=>sb.rpc("admin_delete_teacher",{p_id:uid(id),p_mode:m}),m=="del"?"تم حذف المعلم ✓":m=="arch"?"تمت الأرشفة مع الاحتفاظ بالسجلات ✓":"تم إيقاف المعلم ✓")}
function saveF(id){const n=g("fn"),t=+g("ft");S.err="";if(!n)return bad("اسم الأسرة مطلوب");
 if(FM.some(f=>f.t==t&&f.id!=id&&f.n.toLowerCase()==n.toLowerCase()))return bad("توجد أسرة بنفس الاسم عند هذا المعلم");
 if(!id)return run(()=>sb.from("families").insert({name:n,teacher_id:uid(t)}),"تم حفظ الأسرة ✓");
 const f=FM.find(x=>x.id==id);
 return run(async()=>{let r=await sb.from("families").update({name:n}).eq("id",uid(id));if(r.error)return r;return f.t!=t?sb.rpc("admin_move_family",{p_id:uid(id),p_teacher:uid(t)}):r},"تم حفظ الأسرة ✓")}
const delF=(id,m)=>run(()=>sb.rpc("admin_delete_family",{p_id:uid(id),p_with_students:m=="all"}),"تم حذف الأسرة ✓");
function saveS(id){const n=g("sn"),t=+g("st"),f=+g("sf"),p=g("sp");S.err="";if(!n)return bad("اسم الطالب مطلوب");
 if(p===""||!(+p>=0))return bad("سعر الساعة يجب أن يكون رقماً صفراً أو أكثر");
 if(f&&FM.find(x=>x.id==f).t!=t)return bad("الأسرة المختارة لا تتبع هذا المعلم");
 if(ST.some(z=>z.id!=id&&z.t==t&&z.f==f&&z.n.toLowerCase()==n.toLowerCase()))return bad("يوجد طالب بنفس الاسم في هذه الأسرة عند هذا المعلم");
 return run(async()=>{const row={name:n,teacher_id:uid(t),family_id:f?uid(f):null};let sid=id&&uid(id);
  if(id){const r=await sb.from("students").update(row).eq("id",sid);if(r.error)return r}
  else{const r=await sb.from("students").insert(row).select("id").single();if(r.error)return r;sid=r.data.id}
  return sb.from("student_pricing").upsert({student_id:sid,rate_usd:+p,updated_at:new Date().toISOString()})},"تم حفظ الطالب ✓")}
function delS(id,m){return m=="stop"?run(()=>sb.from("students").update({active:false}).eq("id",uid(id)),"تم إيقاف الطالب ✓"):run(()=>sb.rpc("admin_delete_student",{p_id:uid(id),p_with_lessons:true}),"تم حذف الطالب وحصصه نهائياً ✓")}

 if(!n)return bad("الاسم مطلوب");if(!/^[a-z0-9_-]{3,30}$/.test(u))return bad("اسم المستخدم 3-30 حرفاً: إنجليزي صغير وأرقام و _ و - فقط");if(p.length<8)return bad("كلمة المرور يجب ألا تقل عن 8 أحرف");
 return run(()=>sb.rpc("admin_create_admin",{p_name:n,p_username:u,p_password:p}),"تمت إضافة المشرف ✓")}
function rmAd(i,b){if(!b.dataset.a){b.dataset.a=1;b.textContent="اضغط مرة أخرى للتأكيد";return}const a=AD[i];
 return run(async()=>{const r=await sb.rpc("admin_remove_admin",{p_id:uid(a.id)});if(!r.error&&r.data===true){await out();return{}}return r},"تمت إزالة المشرف ✓")}
function saveFx(){const v=+document.getElementById("fxv").value;if(!(v>0))return bad("سعر الصرف يجب أن يكون رقماً أكبر من صفر");
 return run(()=>sb.from("exchange_rates").update({usd_to_egp:v,updated_at:new Date().toISOString(),updated_by:ME.id}).eq("id",1),"تم حفظ سعر الصرف ✓")}
const P={ov,les,fam,tea,adm,stu,fin,add,mine,stu2};
function R(){if(!S.u){login();return}$(shell(P[S.p]()));}
(async function init(){S.month=todayC().slice(0,7);S.f.d=todayC();
 if(window.APP.configError){$(`<div class="lgn"><div class="cd"><h2>إعدادات ناقصة</h2><p>${window.APP.configError}</p></div></div>`);return}
 try{const r=await sb.auth.getSession();if(r.data.session){const me=await loadMe(r.data.session.user);if(!me.error){ME=me;S.lk=me.role;return go(me.role)}await sb.auth.signOut()}}catch(e){}
